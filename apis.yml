aid: ambientai
name: Ambient.ai
description: >-
  Ambient.ai (legal entity Ambient AI, Inc.) is an AI-powered enterprise physical
  security platform founded in 2016 by Stanford AI researchers Shikhar Shrestha and
  Vikesh Khanna, and headquartered in Redwood City, California. The company created
  the category of "Agentic Physical Security," where purpose-built computer vision and
  a Vision-Language Model (Ambient Pulsar) autonomously observe, detect, assess, and
  respond to real-world threats in real time. Ambient.ai transforms an organization's
  existing cameras, sensors, and access control systems into a unified intelligence
  layer through products including Ambient Foundation (real-time situational awareness),
  Ambient Advanced Forensics (investigation acceleration), Ambient Access Intelligence
  (PACS correlation to eliminate false alarms), and Ambient Threat Detection (150+
  validated threat signatures). It integrates with 200+ ONVIF cameras and VMS/PACS
  platforms such as Axis, Hanwha, Avigilon, Genetec, Milestone, LenelS2, and Honeywell.
  The platform is SOC 2 Type II certified and GDPR/CCPA aligned, uses no facial
  recognition, and stores no PII. Ambient.ai is backed by a16z and Allegion.
